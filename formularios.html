<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Centro Médico - Médico, Consultorio y Medicamento</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<h1>Centro Médico</h1>

<form action="procesar.php" method="post">
  <h2>Registrar médico</h2>
  <input type="hidden" name="entidad" value="medico">
  <label>Identificación</label><input type="text" name="identificacion" maxlength="15" required>
  <label>Nombres</label><input type="text" name="nombres" maxlength="50" required>
  <label>Apellidos</label><input type="text" name="apellidos" maxlength="50" required>
  <label>Especialidad</label><input type="text" name="especialidad" maxlength="50" required>
  <label>Teléfono</label><input type="text" name="telefono" maxlength="15">
  <label>Correo</label><input type="email" name="correo" maxlength="50">
  <button type="submit">Guardar médico</button>
</form>

<form action="procesar.php" method="post">
  <h2>Registrar consultorio</h2>
  <input type="hidden" name="entidad" value="consultorio">
  <label>Nombre</label><input type="text" name="nombre" maxlength="15" required>
  <button type="submit">Guardar consultorio</button>
</form>

<form action="procesar.php" method="post">
  <h2>Registrar medicamento</h2>
  <input type="hidden" name="entidad" value="medicamento">
  <label>Nombre</label><input type="text" name="nombre" maxlength="50" required>
  <label>Presentación</label><input type="text" name="presentacion" maxlength="50">
  <label>Concentración</label><input type="text" name="concentracion" maxlength="30">
  <label>Stock</label><input type="number" name="stock" min="0" value="0">
  <button type="submit">Guardar medicamento</button>
</form>
</body>
</html>
